name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "admin,server,docker-compose.yml,nginx.conf,.env.example,.gitignore"
          target: "/var/www/zmobing"
          overwrite: true

      - name: Build and restart services
        uses: appleboy/ssh-action@v1
        env:
          APP_VERSION: ${{ github.sha }}
          RELEASE_TIME: ${{ github.event.head_commit.timestamp }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: APP_VERSION,RELEASE_TIME
          script: |
            cd /var/www/zmobing
            export VITE_APP_VERSION="${APP_VERSION:0:7}"
            export VITE_RELEASE_TIME="${RELEASE_TIME:-$(date '+%Y-%m-%d %H:%M')}"
            docker compose up -d --build --remove-orphans
            docker image prune -f

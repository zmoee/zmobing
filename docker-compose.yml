services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zmobl}
      MYSQL_USER: ${MYSQL_USER:-zmobl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-zmobl}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-zmobl}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://139.224.234.1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: /api
        VITE_APP_VERSION: ${VITE_APP_VERSION:-本地开发版}
        VITE_RELEASE_TIME: ${VITE_RELEASE_TIME:-未发布}
    restart: unless-stopped
    depends_on:
      - server

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin
      - server

volumes:
  mysql_data:
